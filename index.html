<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dapurkita @pahang</title>
  <meta name="description" content="Direktori masakan rumah dari dapur jiran sekitar Pahang. Pesan terus ke WhatsApp, tiada komisen.">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dapurkita">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Splash -->
  <div id="splash" class="splash" aria-live="polite">
    <div class="splash-rings" aria-hidden="true"><span></span><span></span></div>
    <div class="splash-center">
      <div class="logo-tile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v8a2 2 0 0 0 2 2v10"/><path d="M11 2v8a2 2 0 0 1-2 2"/><path d="M9 2v6"/><path d="M17 2c-1.7 1.3-2.5 3.6-2.5 6.5V13H17v9"/></svg>
      </div>
      <h1 class="splash-name">Dapurkita</h1>
      <div class="handle-pill">
        <span class="flag" role="img" aria-label="Bendera Pahang"><i></i><i></i></span>
        <span>@pahang</span>
      </div>
      <p class="splash-tag">Masakan rumah dari dapur jiran sekitar Pahang</p>
    </div>
    <div class="splash-bottom">
      <div class="progress"><div id="splashBar"></div></div>
      <div class="progress-row"><span id="splashMsg">Memulakan dapur tempatan…</span><span id="splashPct">0%</span></div>
      <div class="splash-towns">Bentong · Karak · Mempaga · Raub · Janda Baik</div>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <main id="view" class="view"></main>

    <nav class="tabbar" aria-label="Navigasi utama">
      <button class="tab" data-tab="home" aria-label="Utama">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Utama</span>
      </button>
      <button class="tab" data-tab="komuniti" aria-label="Komuniti">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg><span>Komuniti</span>
      </button>
      <button class="tab-plus" id="plusBtn" aria-label="Buat iklan atau hantaran">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-tab="disimpan" aria-label="Disimpan">
        <svg viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 12 5.5 5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></svg><span>Disimpan</span>
      </button>
      <button class="tab" data-tab="akaun" aria-label="Akaun">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Akaun</span>
      </button>
    </nav>
  </div>

  <div id="sheetBackdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
